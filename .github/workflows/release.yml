name: Release

# Pushing a tag such as v0.3.5 runs the tests, builds both upload zips from that tag on GitHub's machines, signs a record of
# the build (an attestation: `gh attestation verify <zip> --repo ritwikvashistha/conference-picks` checks it), and puts the
# zips on a draft release. Write the notes and publish the draft by hand; the README's download links follow the latest one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write           # create the draft release and upload the zips
  id-token: write           # sign the attestation
  attestations: write       # store it
  artifact-metadata: write  # asked for by actions/attest

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tests compare SKILL.md with the tag neurips-only-0.1.2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"  # the Python the parity baseline is recorded for

      - name: Check that the tag is the version in plugin.json
        run: |
          version=$(python -c 'import json; print(json.load(open("plugins/conference-picks/.claude-plugin/plugin.json"))["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but plugin.json says $version"
            exit 1
          fi

      - name: Test
        run: |
          for t in tools/test_*.py; do
            echo "== $t"
            python "$t" || exit 1
          done

      - name: Build the zips
        run: python tools/make_zip.py

      - uses: actions/attest@v4
        with:
          subject-path: dist/*.zip

      - name: Put the zips on a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          zips="dist/conference-picks.zip dist/conference-picks-chatgpt.zip"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $zips --clobber
          else
            gh release create "$GITHUB_REF_NAME" $zips --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
